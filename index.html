<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STICK BATTLE</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #151515;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 25px;
  background: #222;
  border-bottom: 3px solid #b72b2b;
}

h1 {
  color: #e33;
  font-size: 42px;
  margin: 5px;
}

.menu {
  padding: 70px 15px;
}

button {
  background: #b52222;
  border: none;
  color: white;
  padding: 15px 30px;
  margin: 8px;
  font-size: 20px;
  cursor: pointer;
  border-radius: 8px;
}

button:hover {
  background: #e33;
}

#gameScreen {
  display: none;
  padding: 15px;
}

canvas {
  width: 100%;
  max-width: 900px;
  background: linear-gradient(#8ac5e5, #e9d5a0);
  border: 3px solid #555;
}

.controls {
  margin: 15px;
}

#levelInfo {
  margin: 8px 0;
  font-size: 20px;
  color: #ffd166;
}

#message {
  min-height: 24px;
  color: #fff;
  font-weight: bold;
}

footer {
  padding: 20px;
  color: #888;
}
</style>
</head>

<body>

<header>
<h1>STICK BATTLE</h1>
<p>Битва стикменов</p>
</header>

<div class="menu" id="menu">
<h2>Добро пожаловать!</h2>
<p>Сражайся на арене!</p>
<button onclick="startGame()">ИГРАТЬ</button>
</div>

<div id="gameScreen">
<h2>АРЕНА</h2>
<div id="levelInfo">УРОВЕНЬ 1 / 5</div>
<div id="message"></div>
<canvas id="game" width="900" height="400"></canvas>

<div class="controls">
<button id="left">◀</button>
<button id="right">▶</button>
<button id="attack">⚔ АТАКА</button>
<button id="block">🛡 БЛОК</button>
<button id="jump">⬆ ПРЫЖОК</button>
</div>

<button onclick="backMenu()">В МЕНЮ</button>
</div>

<footer>
STICK BATTLE © 2026
</footer>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {x:150,y:0,vy:0,hp:100};
let enemy = {x:650,y:0,vy:0,hp:100,maxHp:100};
let keys = {};
let attackCooldown = 0;
let enemyCooldown = 0;
let playerAttacking = false;
let enemyAttacking = false;
let blocking = false;
let active = false;
let direction = 1;
let level = 1;
let transition = 0;
let message = "";

const levelInfo = document.getElementById("levelInfo");
const messageBox = document.getElementById("message");

function startGame() {
  document.getElementById("menu").style.display="none";
  document.getElementById("gameScreen").style.display="block";

  level=1;
  setupLevel();
  active=true;
  loop();
}

function backMenu() {
  active=false;
  document.getElementById("menu").style.display="block";
  document.getElementById("gameScreen").style.display="none";
}

function setupLevel() {
  player.x=150;
  player.y=0;
  player.vy=0;
  player.hp=100;
  enemy.x=650;
  enemy.y=0;
  enemy.vy=0;
  enemy.maxHp=70+level*30;
  enemy.hp=enemy.maxHp;
  attackCooldown=0;
  enemyCooldown=50;
  playerAttacking=false;
  enemyAttacking=false;
  blocking=false;
  transition=0;
  message="";
  levelInfo.textContent=`УРОВЕНЬ ${level} / 5`;
  messageBox.textContent="";
}

function stick(x,y,color,attack,dir) {
  ctx.strokeStyle=color;
  ctx.lineWidth=7;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.arc(x,230-y,17,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x,247-y);
  ctx.lineTo(x,300-y);
  ctx.lineTo(x-20,335-y);
  ctx.moveTo(x,300-y);
  ctx.lineTo(x+20,335-y);
  ctx.moveTo(x,260-y);
  ctx.lineTo(x-25,280-y);
  ctx.moveTo(x,260-y);
  ctx.lineTo(x+25,280-y);
  ctx.stroke();

  ctx.strokeStyle="#ddd";
  ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(x+dir*25,280-y);
  ctx.lineTo(x+dir*(attack?85:50),attack?260-y:270-y);
  ctx.stroke();
}

function health(x,y,hp,maxHp=100) {
  ctx.fillStyle="#600";
  ctx.fillRect(x,y,120,12);
  ctx.fillStyle="#25dd35";
  ctx.fillRect(x,y,Math.max(0,120*hp/maxHp),12);
}

function draw() {
  ctx.clearRect(0,0,900,400);

  ctx.fillStyle="#8a7045";
  ctx.fillRect(0,350,900,50);

  stick(player.x,player.y,"#222",playerAttacking,direction);

  if(enemy.hp>0)
    stick(enemy.x,enemy.y,"#a22",enemyAttacking,-1);

  health(50,30,player.hp);
  health(730,30,enemy.hp,enemy.maxHp);

  ctx.fillStyle="#111";
  ctx.font="18px Arial";
  ctx.fillText("ИГРОК",50,23);
  ctx.fillText(`ВРАГ ${level}`,730,23);

  if(blocking) {
    ctx.fillStyle="rgba(80,160,255,.35)";
    ctx.beginPath();
    ctx.arc(player.x+direction*35,280-player.y,35,0,Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle="#fff";
  ctx.font="28px Arial";
  ctx.textAlign="center";
  ctx.fillText(message,450,155);
  ctx.textAlign="left";
}

function attack() {
  if(!active || attackCooldown>0 || enemy.hp<=0 || blocking) return;

  playerAttacking=true;
  attackCooldown=28;

  if(Math.abs(player.x-enemy.x)<115)
    enemy.hp=Math.max(0,enemy.hp-15);
}

function jump() {
  if(!active || player.y>0) return;
  player.vy=12;
}

function updatePhysics(character) {
  if(character.y>0 || character.vy>0) {
    character.y+=character.vy;
    character.vy-=0.7;
    if(character.y<=0) {
      character.y=0;
      character.vy=0;
    }
  }
}

function loop() {
  if(!active) return;

  if(!transition) {
    if(keys.left && player.x>30) {
      player.x-=3;
      direction=-1;
    }
    if(keys.right && player.x<870) {
      player.x+=3;
      direction=1;
    }
    updatePhysics(player);
    updatePhysics(enemy);

    if(enemy.hp>0) {
      const distance=enemy.x-player.x;

      if(Math.abs(distance)>75) {
        enemy.x+=distance>0?-2-level*.15:2+level*.15;
      } else if(enemyCooldown<=0) {
        enemyAttacking=true;
        enemyCooldown=Math.max(28,75-level*7);
        let damage=8+level*3;
        if(blocking && distance*direction>0) damage=Math.ceil(damage*.25);
        else if(blocking) damage=Math.ceil(damage*.5);
        player.hp=Math.max(0,player.hp-damage);
      }

      if(enemyCooldown>0) enemyCooldown--;
      else enemyAttacking=false;
    }

    if(attackCooldown>0) attackCooldown--;
    else playerAttacking=false;

    if(enemy.hp<=0 && !transition) {
      transition=150;
      if(level===5) {
        message="ВСЕ УРОВНИ ПРОЙДЕНЫ!";
      } else {
        message=`УРОВЕНЬ ${level} ПРОЙДЕН!`;
      }
    }

    if(player.hp<=0) {
      message="ПОРАЖЕНИЕ";
      transition=120;
    }
  } else {
    transition--;
    if(transition===0) {
      if(player.hp<=0) {
        setupLevel();
      } else if(level<5) {
        level++;
        setupLevel();
      } else {
        backMenu();
      }
    }
  }

  draw();
  requestAnimationFrame(loop);
}

function bind(id,key) {
  const b=document.getElementById(id);

  b.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[key]=true;
  });

  ["pointerup","pointerleave","pointercancel"]
  .forEach(event=>b.addEventListener(event,()=>keys[key]=false));
}

bind("left","left");
bind("right","right");

document.getElementById("attack")
.addEventListener("pointerdown",attack);
document.getElementById("block")
.addEventListener("pointerdown",e=>{
  e.preventDefault();
  blocking=true;
});
["pointerup","pointerleave","pointercancel"].forEach(event=>{
  document.getElementById("block").addEventListener(event,()=>blocking=false);
});
document.getElementById("jump")
.addEventListener("pointerdown",e=>{
  e.preventDefault();
  jump();
});

document.addEventListener("keydown",e=>{
  if(e.key==="a" || e.key==="ArrowLeft") keys.left=true;
  if(e.key==="d" || e.key==="ArrowRight") keys.right=true;
  if(e.key===" " && !e.repeat) jump();
});

document.addEventListener("keyup",e=>{
  if(e.key==="a" || e.key==="ArrowLeft") keys.left=false;
  if(e.key==="d" || e.key==="ArrowRight") keys.right=false;
});

canvas.addEventListener("contextmenu",e=>e.preventDefault());
canvas.addEventListener("mousedown",e=>{
  if(e.button===0) attack();
  if(e.button===2) blocking=true;
});
canvas.addEventListener("mouseup",e=>{
  if(e.button===2) blocking=false;
});
canvas.addEventListener("mouseleave",()=>blocking=false);
</script>

</body>
</html>
