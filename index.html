<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STICK BATTLE</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #151515;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 25px;
  background: #222;
  border-bottom: 3px solid #b72b2b;
}

h1 {
  color: #e33;
  font-size: 42px;
  margin: 5px;
}

.menu {
  padding: 70px 15px;
}

button {
  background: #b52222;
  border: none;
  color: white;
  padding: 15px 30px;
  margin: 8px;
  font-size: 20px;
  cursor: pointer;
  border-radius: 8px;
}

button:hover {
  background: #e33;
}

#gameScreen {
  display: none;
  padding: 15px;
}

canvas {
  width: 100%;
  max-width: 900px;
  background: linear-gradient(#8ac5e5, #e9d5a0);
  border: 3px solid #555;
}

.controls {
  margin: 15px;
}

footer {
  padding: 20px;
  color: #888;
}
</style>
</head>

<body>

<header>
<h1>STICK BATTLE</h1>
<p>Битва стикменов</p>
</header>

<div class="menu" id="menu">
<h2>Добро пожаловать!</h2>
<p>Сражайся на арене!</p>
<button onclick="startGame()">ИГРАТЬ</button>
</div>

<div id="gameScreen">
<h2>АРЕНА</h2>
<canvas id="game" width="900" height="400"></canvas>

<div class="controls">
<button id="left">◀</button>
<button id="right">▶</button>
<button id="attack">⚔ АТАКА</button>
</div>

<button onclick="backMenu()">В МЕНЮ</button>
</div>

<footer>
STICK BATTLE © 2026
</footer>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {x:150,hp:100};
let enemy = {x:650,hp:100};
let keys = {};
let cooldown = 0;
let attacking = false;
let active = false;
let direction = 1;

function startGame() {
  document.getElementById("menu").style.display="none";
  document.getElementById("gameScreen").style.display="block";

  player.x=150;
  player.hp=100;
  enemy.x=650;
  enemy.hp=100;
  active=true;
  loop();
}

function backMenu() {
  active=false;
  document.getElementById("menu").style.display="block";
  document.getElementById("gameScreen").style.display="none";
}

function stick(x,color,attack,dir) {
  ctx.strokeStyle=color;
  ctx.lineWidth=7;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.arc(x,230,17,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x,247);
  ctx.lineTo(x,300);
  ctx.lineTo(x-20,335);
  ctx.moveTo(x,300);
  ctx.lineTo(x+20,335);
  ctx.moveTo(x,260);
  ctx.lineTo(x-25,280);
  ctx.moveTo(x,260);
  ctx.lineTo(x+25,280);
  ctx.stroke();

  ctx.strokeStyle="#ddd";
  ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(x+dir*25,280);
  ctx.lineTo(x+dir*(attack?85:50),attack?260:270);
  ctx.stroke();
}

function health(x,y,hp) {
  ctx.fillStyle="#600";
  ctx.fillRect(x,y,120,12);
  ctx.fillStyle="#25dd35";
  ctx.fillRect(x,y,Math.max(0,hp*1.2),12);
}

function draw() {
  ctx.clearRect(0,0,900,400);

  ctx.fillStyle="#8a7045";
  ctx.fillRect(0,350,900,50);

  stick(player.x,"#222",attacking,direction);

  if(enemy.hp>0)
    stick(enemy.x,"#a22",false,-1);

  health(50,30,player.hp);
  health(730,30,enemy.hp);

  ctx.fillStyle="#111";
  ctx.font="18px Arial";
  ctx.fillText("ИГРОК",50,23);
  ctx.fillText("ВРАГ",730,23);

  if(enemy.hp<=0) {
    ctx.font="40px Arial";
    ctx.fillText("ПОБЕДА!",350,150);
  }
}

function attack() {
  if(!active || cooldown>0 || enemy.hp<=0) return;

  attacking=true;
  cooldown=30;

  if(Math.abs(player.x-enemy.x)<110)
    enemy.hp=Math.max(0,enemy.hp-15);
}

function loop() {
  if(!active) return;

  if(keys.left && player.x>30) {
    player.x-=3;
    direction=-1;
  }

  if(keys.right && player.x<870) {
    player.x+=3;
    direction=1;
  }

  if(cooldown>0) cooldown--;
  else attacking=false;

  draw();
  requestAnimationFrame(loop);
}

function bind(id,key) {
  const b=document.getElementById(id);

  b.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[key]=true;
  });

  ["pointerup","pointerleave","pointercancel"]
  .forEach(event=>b.addEventListener(event,()=>keys[key]=false));
}

bind("left","left");
bind("right","right");

document.getElementById("attack")
.addEventListener("pointerdown",attack);

document.addEventListener("keydown",e=>{
  if(e.key==="a" || e.key==="ArrowLeft") keys.left=true;
  if(e.key==="d" || e.key==="ArrowRight") keys.right=true;
  if(e.key===" " && !e.repeat) attack();
});

document.addEventListener("keyup",e=>{
  if(e.key==="a" || e.key==="ArrowLeft") keys.left=false;
  if(e.key==="d" || e.key==="ArrowRight") keys.right=false;
});
</script>

</body>
</html>
