<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>STICK BATTLE</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  background: #151515;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}

header {
  padding: 25px;
  background: #222;
  border-bottom: 3px solid #b72b2b;
}

h1 {
  color: #e33;
  font-size: 42px;
  margin: 5px;
}

.menu {
  padding: 70px 15px;
}

button {
  background: #b52222;
  border: none;
  color: white;
  padding: 15px 30px;
  margin: 8px;
  font-size: 20px;
  cursor: pointer;
  border-radius: 8px;
}

button:hover {
  background: #e33;
}

#gameScreen {
  display: none;
  padding: 15px;
}

canvas {
  width: 100%;
  max-width: 900px;
  background: linear-gradient(#8ac5e5, #e9d5a0);
  border: 3px solid #555;
}

.controls {
  margin: 15px;
}

#levelInfo {
  margin: 8px 0;
  font-size: 20px;
  color: #ffd166;
}

#message {
  min-height: 24px;
  color: #fff;
  font-weight: bold;
}

.hero-choice {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 20px 0;
}

.hero-choice button {
  width: 62px;
  height: 62px;
  padding: 0;
  border: 4px solid transparent;
  border-radius: 50%;
}

.hero-choice button.selected {
  border-color: white;
  box-shadow: 0 0 14px white;
}

.hero-choice button.hero-name {
  width: auto;
  height: auto;
  min-width: 130px;
  border-radius: 8px;
  padding: 10px;
  color: white;
  font-size: 15px;
}

#abilityBar {
  min-height: 48px;
  margin: 8px 0;
}

#abilityBar button {
  padding: 8px 12px;
  font-size: 14px;
  background: #444;
}

footer {
  padding: 20px;
  color: #888;
}
</style>
</head>

<body>

<header>
<h1>STICK BATTLE</h1>
<p>Битва стикменов</p>
</header>

<div class="menu" id="menu">
<h2>Добро пожаловать!</h2>
<p>Сражайся на арене!</p>
<h3>Выбери героя</h3>
<div class="hero-choice">
  <button class="selected hero-name" style="background:#222" onclick="selectHero('#222','chosen',this)">Чёрный<br>Избранный</button>
  <button class="hero-name" style="background:#8b0000" onclick="selectHero('#8b0000','darklord',this)">Красный<br>Дарк Лорд</button>
  <button class="hero-name" style="background:#ff8c00" onclick="selectHero('#ff8c00','second',this)">Оранжевый<br>Секонд</button>
  <button class="hero-name" style="background:#777" onclick="selectHero('#777','victim',this)">Серый<br>Виктим</button>
</div>
<button onclick="startGame()">ИГРАТЬ</button>
</div>

<div id="gameScreen">
<h2>АРЕНА</h2>
<div id="levelInfo">УРОВЕНЬ 1 / 5</div>
<div id="message"></div>
<canvas id="game" width="900" height="400"></canvas>

<div class="controls">
<button id="left">A ◀</button>
<button id="right">D ▶</button>
<button id="attack">⚔ АТАКА</button>
<button id="block">🛡 БЛОК</button>
<button id="jump">⬆ ПРЫЖОК</button>
</div>
<div id="abilityBar"></div>

<button onclick="backMenu()">В МЕНЮ</button>
</div>

<footer>
STICK BATTLE © 2026
</footer>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let player = {x:150,y:0,vy:0,hp:100,color:"#222",hero:"chosen"};
let enemy = {x:650,y:0,vy:0,hp:100,maxHp:100};
let keys = {};
let attackCooldown = 0;
let enemyCooldown = 0;
let playerAttacking = false;
let enemyAttacking = false;
let blocking = false;
let active = false;
let direction = 1;
let level = 1;
let transition = 0;
let message = "";
let loopRunning = false;
let projectiles=[];
let clones=[];
let cooldowns={};
let speedTimer=0;
let hacked=false;

const levelInfo = document.getElementById("levelInfo");
const messageBox = document.getElementById("message");

function selectHero(color,hero,button) {
  player.color=color;
  player.hero=hero;
  document.querySelectorAll(".hero-choice button").forEach(item=>item.classList.remove("selected"));
  button.classList.add("selected");
  renderAbilities();
}

function renderAbilities() {
  const bar=document.getElementById("abilityBar");
  const abilities={
    chosen:[
      ["Q","Красный лазер","eyeLaser"],
      ["E","Огонь","fire"],
      ["R","Электричество","lightning"],
      ["T","Лёд","ice"]
    ],
    darklord:[["Q","Огненный шар","fireball"]],
    second:[
      ["Q","Бросок валуна","boulder"],
      ["E","Зелёный лазер","greenLaser"]
    ],
    victim:[
      ["Q","Молот","hammer"],
      ["E","Меч","sword"],
      ["R","Клоны","clones"],
      ["T","Скорость","speed"],
      ["F","Взлом врага","hack"]
    ]
  };
  bar.innerHTML=(abilities[player.hero]||[])
    .map(item=>`<button onclick="castAbility('${item[2]}')">${item[0]} — ${item[1]}</button>`)
    .join("");
}

function startGame() {
  document.getElementById("menu").style.display="none";
  document.getElementById("gameScreen").style.display="block";

  level=1;
  setupLevel();
  active=true;
  if(!loopRunning) {
    loopRunning=true;
    loop();
  }
}

function backMenu() {
  active=false;
  document.getElementById("menu").style.display="block";
  document.getElementById("gameScreen").style.display="none";
}

function setupLevel() {
  player.x=150;
  player.y=0;
  player.vy=0;
  player.hp=100;
  enemy.x=650;
  enemy.y=0;
  enemy.vy=0;
  enemy.maxHp=55+level*15;
  enemy.hp=enemy.maxHp;
  attackCooldown=0;
  enemyCooldown=50;
  playerAttacking=false;
  enemyAttacking=false;
  blocking=false;
  transition=0;
  message="";
  projectiles=[];
  clones=[];
  cooldowns={};
  speedTimer=0;
  hacked=false;
  levelInfo.textContent=`УРОВЕНЬ ${level} / 5`;
  messageBox.textContent="";
}

function stick(x,y,color,attack,dir) {
  ctx.strokeStyle=color;
  ctx.lineWidth=7;
  ctx.lineCap="round";

  ctx.beginPath();
  ctx.arc(x,230-y,17,0,Math.PI*2);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x,247-y);
  ctx.lineTo(x,300-y);
  ctx.lineTo(x-20,335-y);
  ctx.moveTo(x,300-y);
  ctx.lineTo(x+20,335-y);
  ctx.moveTo(x,260-y);
  ctx.lineTo(x-25,280-y);
  ctx.moveTo(x,260-y);
  ctx.lineTo(x+25,280-y);
  ctx.stroke();

  ctx.strokeStyle="#ddd";
  ctx.lineWidth=5;
  ctx.beginPath();
  ctx.moveTo(x+dir*25,280-y);
  ctx.lineTo(x+dir*(attack?85:50),attack?260-y:270-y);
  ctx.stroke();
}

function health(x,y,hp,maxHp=100) {
  ctx.fillStyle="#600";
  ctx.fillRect(x,y,120,12);
  ctx.fillStyle="#25dd35";
  ctx.fillRect(x,y,Math.max(0,120*hp/maxHp),12);
}

function draw() {
  ctx.clearRect(0,0,900,400);

  ctx.fillStyle="#8a7045";
  ctx.fillRect(0,350,900,50);

  stick(player.x,player.y,player.color,playerAttacking,direction);

  if(enemy.hp>0)
    stick(enemy.x,enemy.y,"#8a2be2",enemyAttacking,-1);

  for(const clone of clones) {
    ctx.globalAlpha=.55;
    stick(clone.x,clone.y,"#777",false,direction);
    ctx.globalAlpha=1;
  }

  for(const shot of projectiles) {
    ctx.fillStyle=shot.color;
    ctx.strokeStyle=shot.color;
    if(shot.type==="hammer") {
      ctx.fillRect(shot.x-12,shot.y-12,24,24);
    } else if(shot.type==="lightning") {
      ctx.lineWidth=5;
      ctx.beginPath();
      ctx.moveTo(shot.x-20,shot.y-15);
      ctx.lineTo(shot.x,shot.y);
      ctx.lineTo(shot.x-10,shot.y+15);
      ctx.lineTo(shot.x+20,shot.y+35);
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(shot.x,shot.y,shot.radius,0,Math.PI*2);
      ctx.fill();
    }
  }

  health(50,30,player.hp);
  health(730,30,enemy.hp,enemy.maxHp);

  ctx.fillStyle="#111";
  ctx.font="18px Arial";
  ctx.fillText("ИГРОК",50,23);
  ctx.fillText(`ВРАГ ${level}`,730,23);

  if(blocking) {
    ctx.fillStyle="rgba(80,160,255,.35)";
    ctx.beginPath();
    ctx.arc(player.x+direction*35,280-player.y,35,0,Math.PI*2);
    ctx.fill();
  }

  ctx.fillStyle="#fff";
  ctx.font="28px Arial";
  ctx.textAlign="center";
  ctx.fillText(message,450,155);
  ctx.textAlign="left";
}

function attack() {
  if(!active || attackCooldown>0 || enemy.hp<=0 || blocking) return;

  playerAttacking=true;
  attackCooldown=28;

  if(Math.abs(player.x-enemy.x)<115)
    enemy.hp=Math.max(0,enemy.hp-15);
}

function jump() {
  if(!active || player.y>0) return;
  player.vy=12;
}

function canCast(name,delay) {
  if(!active || enemy.hp<=0) return false;
  if((cooldowns[name]||0)>0) return false;
  cooldowns[name]=delay;
  return true;
}

function addProjectile(type,color,vx,damage,radius=8,yOffset=0) {
  projectiles.push({
    type,x:player.x+direction*(type==="boulder"?35:45),
    y:230-player.y-yOffset,vx:vx*direction,vy:type==="boulder"?-6:0,
    radius,color,damage,life:180
  });
}

function castAbility(name) {
  if(player.hero==="second") {
    if(name==="boulder" && canCast(name,150)) addProjectile("boulder","#777",7,25,22,35);
    if(name==="greenLaser" && canCast(name,55)) addProjectile("laser","#55ff55",14,14,7);
  }
  if(player.hero==="darklord") {
    if(name==="fireball" && canCast(name,80)) addProjectile("fireball","#ff3b00",10,22,12);
  }
  if(player.hero==="chosen") {
    if(name==="eyeLaser" && canCast(name,50)) addProjectile("laser","#ff2020",16,16,6);
    if(name==="fire" && canCast(name,90)) {
      addProjectile("fire","#ff4d00",11,12,10,0);
      addProjectile("fire","#ff8c00",9,12,14,-25);
    }
    if(name==="lightning" && canCast(name,110)) {
      addProjectile("lightning","#35aaff",13,28,5);
    }
    if(name==="ice" && canCast(name,120)) addProjectile("ice","#86e7ff",10,18,10);
  }
  if(player.hero==="victim") {
    if(name==="hammer" && canCast(name,100)) addProjectile("hammer","#bbb",9,30,18);
    if(name==="sword" && canCast(name,65)) {
      if(Math.abs(player.x-enemy.x)<145) enemy.hp=Math.max(0,enemy.hp-30);
    }
    if(name==="clones" && canCast(name,180)) {
      clones.push({x:player.x-40,y:0,timer:300});
      clones.push({x:player.x-80,y:0,timer:300});
    }
    if(name==="speed" && canCast(name,180)) speedTimer=300;
    if(name==="hack" && canCast(name,300)) {
      hacked=true;
      enemy.hp=0;
    }
  }
}

function updatePhysics(character) {
  if(character.y>0 || character.vy>0) {
    character.y+=character.vy;
    character.vy-=0.7;
    if(character.y<=0) {
      character.y=0;
      character.vy=0;
    }
  }
}

function loop() {
  if(!active) {
    loopRunning=false;
    return;
  }

  if(!transition) {
    if(keys.left && player.x>30) {
      player.x-=speedTimer>0?9:5;
      direction=-1;
    }
    if(keys.right && player.x<870) {
      player.x+=speedTimer>0?9:5;
      direction=1;
    }
    updatePhysics(player);
    updatePhysics(enemy);

    for(const name in cooldowns) {
      if(cooldowns[name]>0) cooldowns[name]--;
    }
    if(speedTimer>0) speedTimer--;

    for(let i=projectiles.length-1;i>=0;i--) {
      const shot=projectiles[i];
      shot.x+=shot.vx;
      if(shot.type==="boulder") {
        shot.vy+=0.35;
        shot.y+=shot.vy;
        if(shot.y>280) {
          shot.y=280;
          shot.vy=-Math.abs(shot.vy)*.45;
        }
      }
      if(enemy.hp>0 && Math.abs(shot.x-enemy.x)<shot.radius+35 &&
         Math.abs(shot.y-(230-enemy.y))<shot.radius+55) {
        enemy.hp=Math.max(0,enemy.hp-shot.damage);
        projectiles.splice(i,1);
        continue;
      }
      shot.life--;
      if(shot.life<=0 || shot.x<0 || shot.x>900) projectiles.splice(i,1);
    }

    for(let i=clones.length-1;i>=0;i--) {
      const clone=clones[i];
      clone.timer--;
      if(Math.abs(clone.x-enemy.x)<100) enemy.hp=Math.max(0,enemy.hp-4);
      clone.x+=enemy.x>clone.x?2:-2;
      if(clone.timer<=0) clones.splice(i,1);
    }

    if(enemy.hp>0) {
      const distance=enemy.x-player.x;

      if(Math.abs(distance)>75) {
        enemy.x+=distance>0?-1-level*.08:1+level*.08;
      } else if(enemyCooldown<=0) {
        enemyAttacking=true;
        enemyCooldown=Math.max(55,100-level*7);
        let damage=5+level;
        if(blocking && distance*direction>0) damage=Math.ceil(damage*.25);
        else if(blocking) damage=Math.ceil(damage*.5);
        player.hp=Math.max(0,player.hp-damage);
      }

      if(enemyCooldown>0) enemyCooldown--;
      else enemyAttacking=false;
    }

    if(attackCooldown>0) attackCooldown--;
    else playerAttacking=false;

    if(enemy.hp<=0 && !transition) {
      transition=150;
      if(level===5) {
        message="ВСЕ УРОВНИ ПРОЙДЕНЫ!";
      } else {
        message=`УРОВЕНЬ ${level} ПРОЙДЕН!`;
      }
    }

    if(player.hp<=0) {
      message="ПОРАЖЕНИЕ";
      transition=120;
    }
  } else {
    transition--;
    if(transition===0) {
      if(player.hp<=0) {
        setupLevel();
      } else if(level<5) {
        level++;
        setupLevel();
      } else {
        backMenu();
      }
    }
  }

  draw();
  requestAnimationFrame(loop);
}

function bind(id,key) {
  const b=document.getElementById(id);

  b.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys[key]=true;
  });

  ["pointerup","pointerleave","pointercancel"]
  .forEach(event=>b.addEventListener(event,()=>keys[key]=false));
}

bind("left","left");
bind("right","right");

document.getElementById("attack")
.addEventListener("pointerdown",attack);
document.getElementById("block")
.addEventListener("pointerdown",e=>{
  e.preventDefault();
  blocking=true;
});
["pointerup","pointerleave","pointercancel"].forEach(event=>{
  document.getElementById("block").addEventListener(event,()=>blocking=false);
});
document.getElementById("jump")
.addEventListener("pointerdown",e=>{
  e.preventDefault();
  jump();
});

document.addEventListener("keydown",e=>{
  if(e.code==="KeyA") {
    e.preventDefault();
    keys.left=true;
  }
  if(e.code==="KeyD") {
    e.preventDefault();
    keys.right=true;
  }
  if(e.code==="Space" && !e.repeat) {
    e.preventDefault();
    jump();
  }
  const abilityKeys={
    KeyQ:["boulder","fireball","eyeLaser","hammer"],
    KeyE:["greenLaser","fire","sword"],
    KeyR:["lightning","clones"],
    KeyT:["ice","speed"],
    KeyF:["hack"]
  };
  if(abilityKeys[e.code]) {
    e.preventDefault();
    const names=abilityKeys[e.code];
    const heroNames={
      second:["boulder","greenLaser"],
      darklord:["fireball"],
      chosen:["eyeLaser","fire","lightning","ice"],
      victim:["hammer","sword","clones","speed","hack"]
    };
    const allowed=heroNames[player.hero]||[];
    const name=names.find(item=>allowed.includes(item));
    if(name) castAbility(name);
  }
});

document.addEventListener("keyup",e=>{
  if(e.code==="KeyA") {
    e.preventDefault();
    keys.left=false;
  }
  if(e.code==="KeyD") {
    e.preventDefault();
    keys.right=false;
  }
});

window.addEventListener("blur",()=>{
  keys.left=false;
  keys.right=false;
  blocking=false;
});

canvas.addEventListener("contextmenu",e=>e.preventDefault());
canvas.addEventListener("mousedown",e=>{
  if(e.button===0) attack();
  if(e.button===2) blocking=true;
});
canvas.addEventListener("mouseup",e=>{
  if(e.button===2) blocking=false;
});
canvas.addEventListener("mouseleave",()=>blocking=false);
renderAbilities();
</script>

</body>
</html>
